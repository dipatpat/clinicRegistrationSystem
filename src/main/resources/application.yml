spring:
  application:
    name: ClinicRegistrationSystem

  datasource:
    url: jdbc:h2:mem:clinic;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false
