<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — LuxuryMed'">LuxuryMed</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav th:fragment="nav">
    <div class="nav-brand">LuxuryMed</div>
    <div class="nav-links">
        <span sec:authorize="hasRole('STAFF')">
            <a th:href="@{/appointments}">Appointments</a>
        </span>
        <span sec:authorize="hasRole('DOCTOR')">
            <a th:href="@{/my-schedule}">My Schedule</a>
        </span>
        <span sec:authorize="hasRole('MANAGER')">
            <a th:href="@{/dashboard}">Dashboard</a>
        </span>
        <span sec:authorize="hasRole('PATIENT')">
            <a th:href="@{/my-appointments}">My Appointments</a>
        </span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-link">Logout (<span sec:authentication="name"></span>)</button>
        </form>
    </div>
</nav>

</body>
</html>
